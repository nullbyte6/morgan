[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3.34"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
textwrap = "0.16.4"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2.2"
