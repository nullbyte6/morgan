name: release

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements.txt pyinstaller
      - shell: bash
        env:
          MORGAN_BUILD_OUTPUT: C:/
        run: scripts/build-exe.sh
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" MorganSetup.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/installer/MorganSetup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
      - run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils binutils libportaudio2 libxcb-cursor0
          python -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir -r requirements.txt pyinstaller
          bash scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/installer/MorganSetup.run

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version dev/core.json)"
          gh release view "$version" >/dev/null 2>&1 || gh release create "$version" --title "$version" --prerelease --notes "**Full Changelog**
Check [CHANGELOG](https://github.com/xddigs/morgan/blob/main/CHANGELOG.md) for release notes"
          gh release upload "$version" dist/* --clobber
